<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Nutri Logo - Simple leaf/nutrition symbol -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF006B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="black" stroke="url(#grad)" stroke-width="2"/>

  <!-- Stylized "N" with leaf motif -->
  <path d="M 30 30 L 30 70 L 35 70 L 35 42 L 65 70 L 70 70 L 70 30 L 65 30 L 65 58 L 35 30 Z"
        fill="url(#grad)"/>
</svg>
